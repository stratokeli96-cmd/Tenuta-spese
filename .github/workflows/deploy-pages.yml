name: Deploy PWA to GitHub Pages

# Pubblica il sito statico (la PWA) su GitHub Pages.
# Prerequisito (una volta sola): Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - Tenuta-spese-telefono
      - Tenuta-spesa-finale-V1
  workflow_dispatch:

# Permessi necessari per il deploy su Pages tramite OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test (logica, versioni, SRI, escape)
        run: node --test tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html logic.js manifest.json sw.js _site/
          cp -r icons _site/icons

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
